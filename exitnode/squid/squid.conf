visible_hostname squid-exitnode

# Transparent interception from exitnode-gw iptables
http_port 3128 intercept
# Explicit proxy port for PoC verification scripts
http_port 3129

acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
external_acl_type opa_policy ttl=60 negative_ttl=10 %DST /usr/local/bin/opa_acl_helper.sh
acl opa_allowed external opa_policy

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny !opa_allowed
http_access allow localhost
http_access allow localnet
http_access deny all

icap_enable on
icap_send_client_ip on
icap_service service_req reqmod_precache bypass=1 icap://squidscas:1344/squidscas
adaptation_access service_req allow all
icap_service service_resp respmod_precache bypass=1 icap://squidscas:1344/squidscas
adaptation_access service_resp allow all

logformat shadow %ts.%03tu %>a %rm %>Hs %<st %>ru
access_log daemon:/var/log/squid/shadow.log shadow

cache deny all
coredump_dir /var/spool/squid
pid_filename /var/run/squid.pid
